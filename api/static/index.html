<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Maize Disease Check</title>
  <style>
    * { box-sizing: border-box; }
    body { font-family: system-ui, sans-serif; max-width: 480px; margin: 2rem auto; padding: 0 1rem; }
    h1 { font-size: 1.25rem; }
    input[type="file"] { margin: 0.5rem 0; display: block; }
    button { padding: 0.5rem 1rem; cursor: pointer; margin: 0.25rem 0.25rem 0.25rem 0; }
    #preview { max-width: 100%; max-height: 200px; margin: 0.5rem 0; border: 1px solid #ccc; }
    #result { margin-top: 1rem; padding: 1rem; background: #f5f5f5; border-radius: 8px; white-space: pre-wrap; }
    .error { color: #c00; }
  </style>
</head>
<body>
  <h1>Maize Disease Check</h1>
  <input type="file" id="file" accept="image/*" />
  <img id="preview" alt="Preview" style="display: none;" />
  <div>
    <button type="button" id="btnLeaf">Check leaf / non-leaf</button>
    <button type="button" id="btnDisease">Check disease</button>
  </div>
  <div id="result"></div>

  <script>
    const fileInput = document.getElementById('file');
    const preview = document.getElementById('preview');
    const btnLeaf = document.getElementById('btnLeaf');
    const btnDisease = document.getElementById('btnDisease');
    const result = document.getElementById('result');

    fileInput.addEventListener('change', (e) => {
      const f = e.target.files[0];
      if (!f) return;
      preview.style.display = 'block';
      preview.src = URL.createObjectURL(f);
    });

    function showError(msg) {
      result.innerHTML = '<span class="error">' + msg + '</span>';
    }

    function showLeafResult(data) {
      let text = 'Leaf / Non-leaf: ' + data.class + '\nConfidence: ' + (data.confidence * 100).toFixed(2) + '%\n\n';
      text += Object.entries(data.probabilities).map(([k, v]) => k + ': ' + (v * 100).toFixed(2) + '%').join('\n');
      result.innerHTML = text.replace(/\n/g, '<br>');
    }

    function showDiseaseResult(data) {
      let text = 'Prediction: ' + data.class + '\nConfidence: ' + (data.confidence * 100).toFixed(2) + '%\n\nProbabilities:\n';
      text += Object.entries(data.probabilities).map(([k, v]) => k + ': ' + (v * 100).toFixed(2) + '%').join('\n');
      if (data.low_confidence && data.warning) {
        text = '<span class="error">' + data.warning + '</span><br><br>' + text;
      }
      result.innerHTML = text.replace(/\n/g, '<br>');
    }

    async function doRequest(url, label) {
      const f = fileInput.files[0];
      if (!f) {
        showError('Please select an image.');
        return;
      }
      result.textContent = 'Predicting...';
      const form = new FormData();
      form.append('file', f);
      try {
        const r = await fetch(url, { method: 'POST', body: form });
        const data = await r.json();
        if (!r.ok) {
          const msg = typeof data.detail === 'string' ? data.detail : (data.detail && data.detail.msg) || JSON.stringify(data.detail) || r.statusText;
          showError(msg);
          return;
        }
        if (url === '/check-leaf') showLeafResult(data);
        else showDiseaseResult(data);
      } catch (e) {
        showError('Request failed: ' + e.message);
      }
    }

    btnLeaf.addEventListener('click', () => doRequest('/check-leaf', 'leaf'));
    btnDisease.addEventListener('click', () => doRequest('/predict', 'disease'));
  </script>
</body>
</html>
